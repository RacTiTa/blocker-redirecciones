<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Navegación bloqueada</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1d2733; background: #eef1f4; }
    main { max-width: 520px; padding: 32px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: #5d6b7a; }
    code { display: block; padding: 10px 12px; border-left: 3px solid #e8590c; background: #fff;
      word-break: break-all; font-size: 13px; color: #1d2733; margin-bottom: 20px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    button, a { font: inherit; padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; }
    #back { border: 0; background: #e8590c; color: #fff; font-weight: 600; }
    #go { border: 1px solid #cfd6de; color: #1d2733; background: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Esta navegación fue bloqueada</h1>
    <p>Algo intentó llevarte a un dominio de tu lista de bloqueo.</p>
    <code id="url"></code>
    <div class="actions">
      <button id="back">Volver atrás</button>
      <a id="go" href="#">Abrir de todas formas</a>
    </div>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
